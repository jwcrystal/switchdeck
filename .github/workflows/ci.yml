name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Translations
        run: ./scripts/check-localizations.sh

      - name: Test
        run: swift test

      - name: Package the app
        run: ./scripts/build-app.sh
